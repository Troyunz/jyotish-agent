name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"        # pyswisseph ships wheels up to 3.11
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Chart-engine self-tests (ephemeris, dasha, Ashtakavarga, verifier, topic routing)
        run: python test_agent.py

      - name: Build knowledge index (keyword mode, no network models needed)
        run: python build_index.py --no-embed

      - name: UI smoke test (renders all tabs, calculates a sample chart)
        run: |
          python - <<'PY'
          import datetime
          from streamlit.testing.v1 import AppTest

          at = AppTest.from_file("app.py", default_timeout=180).run()
          assert not at.exception, [e.value for e in at.exception]

          at.sidebar.text_input[0].set_value("CI Test")
          at.sidebar.text_input[1].set_value("New Delhi")
          at.sidebar.date_input[0].set_value(datetime.date(1990, 1, 1))
          at.sidebar.time_input[0].set_value(datetime.time(12, 0))
          [b for b in at.sidebar.button if b.label == "Calculate chart"][0].set_value(True)
          at.run()
          assert not at.exception, [e.value for e in at.exception]
          print("UI smoke test passed:", [s.value for s in at.success])
          PY
